<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>회원가입 | MVC Lab</title>
</head>
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h1 class="h2 mb-4">회원가입</h1>
            <form class="card border-0 shadow-sm" th:action="@{/members/join}" th:object="${memberForm}" method="post"
                  novalidate>
                <div class="card-body p-4">
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                        <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">입력값을 확인해주세요.</p>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">아이디</label>
                        <input id="name" type="text" class="form-control" th:field="*{name}"
                               th:errorclass="is-invalid" minlength="2" maxlength="20" autocomplete="username">
                        <div class="invalid-feedback" th:errors="*{name}">아이디 오류</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">비밀번호</label>
                        <input id="password" type="password" class="form-control" th:field="*{password}"
                               th:errorclass="is-invalid" minlength="4" maxlength="20" autocomplete="new-password">
                        <div class="invalid-feedback" th:errors="*{password}">비밀번호 오류</div>
                        <div class="form-text">영문과 숫자만 사용하여 4~20자로 입력하세요.</div>
                    </div>
                    <div class="mb-3">
                        <label for="passwordConfirm" class="form-label">비밀번호 확인</label>
                        <input id="passwordConfirm" type="password" class="form-control" th:field="*{passwordConfirm}"
                               th:errorclass="is-invalid" autocomplete="new-password">
                        <div class="invalid-feedback" th:errors="*{passwordConfirm}">비밀번호 확인 오류</div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">이메일</label>
                        <input id="email" type="email" class="form-control" th:field="*{email}"
                               th:errorclass="is-invalid" autocomplete="email">
                        <div class="invalid-feedback" th:errors="*{email}">이메일 오류</div>
                    </div>
                    <div class="mb-3">
                        <label for="age" class="form-label">나이</label>
                        <input id="age" type="number" class="form-control" th:field="*{age}"
                               th:errorclass="is-invalid" min="19" max="150">
                        <div class="invalid-feedback" th:errors="*{age}">나이 오류</div>
                    </div>
                    <div class="form-check mb-3">
                        <input id="agree" type="checkbox" class="form-check-input" th:field="*{agree}"
                               th:errorclass="is-invalid">
                        <label for="agree" class="form-check-label">이용약관에 동의합니다.</label>
                        <div class="invalid-feedback" th:errors="*{agree}">약관 동의 오류</div>
                    </div>
                </div>
                <div class="card-footer bg-white border-0 px-4 pb-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">가입하기</button>
                    <a class="btn btn-outline-secondary" th:href="@{/members}">취소</a>
                </div>
            </form>
        </div>
    </div>
</main>
<script></script>
</body>
</html>
