<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>회원 수정 | MVC Lab</title>
</head>
<body>
<main>
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h1 class="h2 mb-4">회원 정보 수정</h1>
            <form class="card border-0 shadow-sm"
                  th:action="@{/members/edit/{id}(id=${memberForm.id})}"
                  th:object="${memberForm}" method="put" novalidate>
                <input type="hidden" name="_method" value="put">
                <input type="hidden" th:field="*{id}">
                <div class="card-body p-4">
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                        <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">입력값을 확인해주세요.</p>
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">아이디</label>
                        <input id="name" type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{name}">아이디 오류</div>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">이메일</label>
                        <input id="email" type="email" class="form-control" th:field="*{email}"
                               th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{email}">이메일 오류</div>
                    </div>
                    <div class="mb-3">
                        <label for="age" class="form-label">나이</label>
                        <input id="age" type="number" class="form-control" th:field="*{age}"
                               th:errorclass="is-invalid" min="19" max="150">
                        <div class="invalid-feedback" th:errors="*{age}">나이 오류</div>
                    </div>

                    <!-- 현재 MemberForm 전체를 @Valid로 검사하므로 수정 화면에도 아래 값이 필요합니다. -->
                    <input type="hidden" th:field="*{password}">
                    <input type="hidden" th:field="*{passwordConfirm}">
                    <input type="hidden" name="agree" value="true">
                </div>
                <div class="card-footer bg-white border-0 px-4 pb-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">수정 완료</button>
                    <a class="btn btn-outline-secondary" th:href="@{/members/{id}(id=${memberForm.id})}">취소</a>
                </div>
            </form>
        </div>
    </div>
</main>
<script></script>
</body>
</html>
