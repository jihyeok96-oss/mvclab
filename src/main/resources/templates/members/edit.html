<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('회원 정보 수정')}">
</head>
<body>
<header th:replace="~{layout/base :: header}">
</header>
<main class="section">
    <div class="container">
        <div class="form-card">
            <!-- Header -->
            <div class="page-header">
                <h1 class="title">
                    회원 정보 수정
                </h1>
                <p class="subtitle">
                    회원 정보를 수정합니다.
                </p>
            </div>
            <!-- Form -->
            <div class="card">
                <div class="card-content">
                    <form
                            id="memberEditForm"
                            th:object="${memberForm}"
                            th:attr="data-member-id=${memberForm.id}">
                        <!-- ID -->
                        <div class="field">
                            <label class="label">
                                ID
                            </label>
                            <div class="control">
                                <input
                                        type="text"
                                        class="input"
                                        th:field="*{id}"
                                        readonly>
                            </div>
                        </div>
                        <!-- 이름 -->
                        <div class="field">
                            <label class="label"
                                   for="name">
                                이름
                            </label>
                            <div class="control">
                                <input
                                        id="name"
                                        type="text"
                                        class="input"
                                        th:field="*{name}"
                                        placeholder="이름을 입력하세요">
                            </div>
                            <p
                                    th:if="${#fields.hasErrors('name')}"
                                    th:errors="*{name}"
                                    class="help is-danger">
                                이름 오류
                            </p>
                        </div>
                        <!-- 이메일 -->
                        <div class="field">
                            <label class="label"
                                   for="email">
                                이메일
                            </label>
                            <div class="control">
                                <input
                                        id="email"
                                        type="email"
                                        class="input"
                                        th:field="*{email}"
                                        placeholder="example@email.com">
                            </div>
                            <p
                                    th:if="${#fields.hasErrors('email')}"
                                    th:errors="*{email}"
                                    class="help is-danger">
                                이메일 오류
                            </p>
                        </div>
                        <!-- 나이 -->
                        <div class="field">
                            <label class="label"
                                   for="age">
                                나이
                            </label>
                            <div class="control">
                                <input
                                        id="age"
                                        type="number"
                                        class="input"
                                        th:field="*{age}"
                                        min="1"
                                        max="150"
                                        placeholder="나이를 입력하세요">
                            </div>
                            <p
                                    th:if="${#fields.hasErrors('age')}"
                                    th:errors="*{age}"
                                    class="help is-danger">
                                나이 오류
                            </p>
                        </div>
                        <!-- 비밀번호 -->
                        <div class="field">
                            <label class="label"
                                   for="password">
                                비밀번호
                            </label>
                            <div class="control">
                                <input
                                        id="password"
                                        type="password"
                                        class="input"
                                        th:field="*{password}"
                                        autocomplete="new-password">
                            </div>
                            <p
                                    th:if="${#fields.hasErrors('password')}"
                                    th:errors="*{password}"
                                    class="help is-danger">
                                비밀번호 오류
                            </p>
                        </div>
                        <!-- 비밀번호 확인 -->
                        <div class="field">
                            <label class="label"
                                   for="passwordConfirm">
                                비밀번호 확인
                            </label>
                            <div class="control">
                                <input
                                        id="passwordConfirm"
                                        type="password"
                                        class="input"
                                        th:field="*{passwordConfirm}"
                                        autocomplete="new-password">
                            </div>
                            <p
                                    th:if="${#fields.hasGlobalErrors()}"
                                    th:each="error : ${#fields.globalErrors()}"
                                    th:text="${error}"
                                    class="help is-danger">
                                비밀번호 확인 오류
                            </p>
                        </div>
                        <!-- Buttons -->
                        <div class="field is-grouped mt-6">
                            <div class="control">
                                <button
                                        type="submit"
                                        class="button is-link">
                                    수정 완료
                                </button>
                            </div>
                            <div class="control">
                                <a
                                        th:href="@{/members/{id}(id=${memberForm.id})}"
                                        class="button is-light">
                                    취소
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{layout/base :: footer}"></footer>
<script th:src="@{/js/member.js}"></script>
</body>
</html>
