<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::title}, ~{::main}, ~{::script})}">
<head>
    <title>회원 목록 | MVC Lab</title>
</head>
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 mb-0">회원 목록</h1>
        <a class="btn btn-primary" th:href="@{/members/join}">회원가입</a>
    </div>

    <div th:if="${param.message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${param.message[0]}">처리가 완료되었습니다.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="닫기"></button>
    </div>

    <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th scope="col">번호</th>
                <th scope="col">이름(아이디)</th>
                <th scope="col">이메일</th>
                <th scope="col">나이</th>
                <th scope="col">가입일</th>
                <th scope="col" class="text-center">관리</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(members)}">
                <td colspan="6" class="py-5 text-center text-secondary">등록된 회원이 없습니다.</td>
            </tr>
            <tr th:each="member : ${members}">
                <td th:text="${member.id}">1</td>
                <td>
                    <a class="fw-semibold text-decoration-none"
                       th:href="@{/members/{id}(id=${member.id})}"
                       th:text="${member.name}">hong</a>
                </td>
                <td th:text="${member.email}">hong@example.com</td>
                <td th:text="|${member.age}세|">20세</td>
                <td th:text="${member.createdAt != null ? #temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">2026-09-16</td>
                <td class="text-center text-nowrap">
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/members/edit/{id}(id=${member.id})}">수정</a>
                    <button type="button" class="btn btn-sm btn-outline-danger js-delete-member"
                            th:data-member-id="${member.id}"
                            th:data-member-name="${member.name}">삭제</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<script th:src="@{/js/member.js}"></script>
</body>
</html>
