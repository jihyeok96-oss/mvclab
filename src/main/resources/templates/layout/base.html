<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content, script)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">회원 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">MVC Lab</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/members}">회원 목록</a>
            <a class="nav-link" th:href="@{/members/join}">회원가입</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <th:block th:replace="${content}"></th:block>
</main>

<footer class="border-top bg-white py-4 text-center text-secondary">
    <small>&copy; 2026 MVC Lab</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<th:block th:replace="${script}"></th:block>
</body>
</html>
