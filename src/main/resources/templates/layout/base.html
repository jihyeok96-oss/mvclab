<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title th:text="${title}">Spring MVC</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="stylesheet" th:href="@{/css/bulma.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- Header -->
<header th:fragment="header">
    <nav class="navbar is-dark"
         role="navigation"
         aria-label="main navigation">
        <div class="container">
            <!-- Logo -->
            <div class="navbar-brand">
                <a class="navbar-item has-text-weight-bold"
                   th:href="@{/}">
                    Spring MVC Lab
                </a>
                <a role="button"
                   class="navbar-burger"
                   aria-label="menu"
                   aria-expanded="false"
                   data-target="mainNavbar">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </a>
            </div>
            <!-- Navigation -->
            <div id="mainNavbar"
                 class="navbar-menu">
                <div class="navbar-start">
                    <a class="navbar-item"
                       th:href="@{/}">
                        홈
                    </a>
                    <a class="navbar-item"
                       th:href="@{/members}">
                        회원 목록
                    </a>
                    <a class="navbar-item"
                       th:href="@{/members/new}">
                        회원 등록
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>
<!-- Content -->
<main class="main-content section">
    <div class="container">
        <div th:fragment="content">
        </div>
    </div>
</main>
<!-- Footer -->
<footer th:fragment="footer" class="footer">
    <div class="content has-text-centered">
        <p>
            <strong>Spring MVC GIT</strong>
            &nbsp;|&nbsp;
            ⓒGIT Mobility At 2026
        </p>
        <p class="is-size-7 has-text-grey">
            Spring MVC 학습용 웹 애플리케이션
        </p>
    </div>
</footer>
<!-- 공통 JavaScript -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const burgers =
            Array.prototype.slice.call(
                document.querySelectorAll('.navbar-burger'),
                0
            );
        burgers.forEach(burger => {
            burger.addEventListener('click', () => {
                const target =
                    burger.dataset.target;
                const targetElement =
                    document.getElementById(target);
                burger.classList.toggle('is-active');
                targetElement.classList.toggle('is-active');
            });
        });
    });
</script>
</body>
</html>
