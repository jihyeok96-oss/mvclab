<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('페이지를 찾을 수 없습니다')}">
</head>
<body>
<header th:replace="~{layout/base :: header}">
</header>
<main class="section">
    <div class="container">
        <section class="hero is-warning is-light">
            <div class="hero-body has-text-centered">
                <p class="title is-1">
                    404
                </p>
                <p class="subtitle">
                    페이지를 찾을 수 없습니다.
                </p>
                <p class="mb-5">
                    요청하신 페이지가 존재하지 않거나
                    삭제되었을 수 있습니다.
                </p>
                <div class="buttons is-centered">
                    <a
                            class="button is-warning"
                            th:href="@{/}">
                        홈으로 이동
                    </a>
                    <a
                            class="button is-light"
                            th:href="@{/members}">
                        회원 목록
                    </a>
                </div>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{layout/base :: footer}">
</footer>
</body>
</html>
